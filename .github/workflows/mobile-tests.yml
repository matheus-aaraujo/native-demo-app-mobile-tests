name: Mobile Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project setup
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate WebdriverIO configs
        run: npm run validate:config

      - name: Run lint
        run: npm run lint

  android-local-tests:
    name: Run Android tests on emulator
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      APPIUM_HOST: 127.0.0.1
      APPIUM_PORT: 4723
      APPIUM_PATH: /
      ANDROID_DEVICE_NAME: emulator-5554
      ANDROID_APP_PACKAGE: com.wdiodemoapp
      ANDROID_APP_ACTIVITY: com.wdiodemoapp.MainActivity

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Appium server and Android driver
        run: |
          npm install -g appium@2
          appium driver install uiautomator2@4.2.9

      - name: Download Android app
        run: |
          mkdir -p apps
          APK_URL=$(curl -s https://api.github.com/repos/webdriverio/native-demo-app/releases/latest | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
          test -n "$APK_URL"
          curl -L "$APK_URL" -o apps/native-demo-app.apk

      - name: Run Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -wipe-data -memory 4096
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6000M
          emulator-boot-timeout: 1200
          disable-animations: true
          script: |
            appium --log-level info > appium.log 2>&1 &
            adb devices
            adb install -r apps/native-demo-app.apk
            npm run test:android:local

      - name: Upload Appium log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: appium.log
          if-no-files-found: ignore

      - name: Generate Allure report
        if: always()
        run: npm run report:generate

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-android-local
          path: allure-report/
          if-no-files-found: ignore




